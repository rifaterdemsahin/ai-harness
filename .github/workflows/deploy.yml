name: Deploy
on:
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-harness-flow/package-lock.json
      - name: Build flow diagram
        working-directory: ai-harness-flow
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/ai-harness-flow
          cp index.html _site/
          cp -r ai-harness-flow/dist/* _site/ai-harness-flow/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4